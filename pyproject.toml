[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-knowledge-embedding"
version = "0.1.0"
description = "Physics-knowledge embedding components and Transolver experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
transolver = [
  "einops>=0.7",
  "h5py>=3.9",
  "huggingface-hub>=0.24",
  "scipy>=1.10",
  "timm>=0.9",
  "tqdm>=4.66",
]
dev = ["pytest>=8.0"]

[project.scripts]
physics-embed-data = "physics_embed.data:main"
physics-embed-train = "physics_embed.train:main"
physics-embed-evaluate = "physics_embed.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
